/* Layout: one handheld column. LCD on top, pad cluster beside shift/alpha, 30-unit grid for 6- and 5-key rows. */
:root{
  --body:#25282d; --bezel:#15171a; --panel:#1d2024;
  --lcd:#b7c4a6; --lcd2:#a9b799; --ink:#1b2618; --ink-dim:rgba(27,38,24,.42);
  --key:#3a3e45; --key-hi:#4a4f57; --key-dk:#17181b; --num:#e6e7e9; --num-ink:#16171a; --txt:#eceef0;
  --shift:#f0b429; --alpha:#ee6352; --del:#e9822c; --line:#0c0d0f;
  --disp:'Share Tech Mono','Courier New',monospace; --lab:'Barlow Condensed','Arial Narrow',Arial,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0}
body{background:var(--bezel);color:var(--txt);font-family:var(--lab);
  padding-block:10px 22px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  display:flex;justify-content:center;user-select:none;-webkit-user-select:none}
.calc{width:100%;max-width:430px;background:var(--body);border-radius:22px 22px 36px 36px;padding:14px 12px 20px;
  box-shadow:0 0 0 1px #000,0 14px 30px rgba(0,0,0,.45),inset 0 1px 0 rgba(255,255,255,.07)}
.brand{display:flex;justify-content:space-between;align-items:center;padding:0 4px 8px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;font-size:12px;color:var(--brand2)}
.brand b{font-size:15px;letter-spacing:.2em;color:var(--brand1)}
.solar{width:46px;height:12px;background:repeating-linear-gradient(90deg,#2b2218 0 10px,#3b2e1f 10px 11px);border-radius:2px;border:1px solid #000}
/* LCD */
.lcd{background:var(--lcd);border-radius:8px;border:3px solid #0d0e10;box-shadow:inset 0 2px 8px rgba(0,0,0,.45);color:var(--ink);
  height:226px;display:flex;flex-direction:column;font-family:var(--disp);position:relative;overflow:hidden}
.ind{display:flex;gap:7px;align-items:center;padding:3px 7px 2px;font-size:10px;font-weight:700;letter-spacing:.04em;border-bottom:1px solid var(--ink-dim);min-height:17px;font-family:var(--lab);text-transform:uppercase}
.ind span{opacity:.18}.ind span.on{opacity:1}.ind .sp{flex:1;opacity:1}
.scr{flex:1;min-height:0;padding:4px 8px 4px;display:flex;flex-direction:column;font-size:17px;line-height:1.25;overflow:hidden}
.inp{flex:1;min-height:0;overflow:auto;white-space:nowrap;font-size:19px;padding-top:4px;scrollbar-width:none}
.inp::-webkit-scrollbar{display:none}
.inp.wrap{white-space:normal;word-break:break-all}
.res{text-align:right;font-size:27px;min-height:44px;padding-bottom:2px;white-space:nowrap;overflow-x:auto;scrollbar-width:none}
.res.sm{font-size:19px}.res small{font-size:14px}
.res.err{font-size:20px;text-align:left}
.cur{display:inline-block;width:2px;height:1.1em;background:var(--ink);vertical-align:text-bottom;margin:0 -1px;animation:bl 1s steps(1) infinite}
.cur.ov{width:.55em;height:3px;margin:0}
@keyframes bl{50%{opacity:0}}
@media (prefers-reduced-motion:reduce){.cur{animation:none}}
.fr{display:inline-flex;flex-direction:column;vertical-align:middle;text-align:center;margin:0 .14em;line-height:1.15}
.nu{border-bottom:1.5px solid var(--ink);padding:0 3px;min-width:.7em}.de{padding:0 3px;min-width:.7em}

const numToks=x=>{let s=String(Number(x.toPrecision(10)));if(/e/.test(s))s='0';return s.split('')};
function startPrompt(kind){const E=ED;if(!E.ed.t.length||E.phase==='error')return;const toks=E.ed.t.slice();
 let vars=[...new Set(toks.filter(t=>VARTOK.has(t)))];if(toks.some(t=>['∫(','Σ(','Π(','d/dx('].includes(t)))vars=vars.filter(v=>v!=='x');
 if(!vars.length){if(kind==='calc'){E.phase='edit';compute(true);return}throw E_SYN()}
 push(promptScreen(kind,toks,vars))}
function promptScreen(kind,toks,vars){const p={i:0,eds:vars.map(v=>new TokEd(numToks(V[v]))),fresh:vars.map(()=>true)};
 p.render=()=>`<div class="title">${kind==='calc'?'CALC':'SOLVE'}${kind==='solve'?' <small>(SHIFT CALC = solve this var)</small>':''}</div>`+vars.map((v,i)=>`<div class="mi" style="justify-content:space-between"><span>${v}=</span><span class="inp" style="flex:1;text-align:right;padding:0;font-size:17px;overflow:hidden">${tedHTML(p.eds[i],i===p.i)}</span></div>`).join('');
 const commit=()=>{const v=rnum(cleanV(evalToks(p.eds[p.i].t)));V[vars[p.i]]=v};
 const finish=()=>{const E=ED;E.ed.t=toks;E.ed.c=toks.length;home();E.phase='edit';compute(true)};
 const solve=i=>{const E=ED,node=parseToks(toks),name=vars[i],base={};vars.forEach(v=>base[v]=V[v]);
  const g=t=>{const r=ev(node,{...base,[name]:t});return r&&r.rel?rnum(r.l)-rnum(r.r):rnum(r)};
  const[x,y]=solveRoot(g,V[name]);V[name]=Number(x.toPrecision(15));MEM.pre=MEM.ans;MEM.ans=V[name];
  E.ed.t=toks;E.ed.c=toks.length;E.res={v:new Pair([name,'L−R'],[V[name],Math.abs(y)<1e-9?0:y]),ctx:{dec:true},alt:false};E.phase='result';E.err=null;home()};
 p.act=a=>{const ed=p.eds[p.i];if(INS[a]&&p.fresh[p.i]){ed.clear();p.fresh[p.i]=false}if(a==='left'||a==='right')p.fresh[p.i]=false;if(edIns(ed,a))return;
  if(a==='del')ed.del();else if(a==='left')ed.left();else if(a==='right')ed.right();
  else if(a==='up')p.i=Math.max(0,p.i-1);else if(a==='down')p.i=Math.min(vars.length-1,p.i+1);
  else if(a==='ac')pop();
  else if(a==='solve'&&kind==='solve'){vars.forEach((v,i)=>{p.i=i;commit()});solve(vars.indexOf(vars[p.i]))}
  else if(a==='eq'){commit();if(p.i<vars.length-1)p.i++;else if(kind==='calc')finish();else if(vars.length===1)solve(0);else p.i=0}};
 return p}

const GR={f:['x'],g:[],x0:-10,x1:10,y0:-6,y1:6};
function graphScreen(){const q={tr:(GR.x0+GR.x1)/2,fn:0,cv:null,W:0,H:0};
 const fns=()=>[GR.f,GR.g].map(t=>t.length?parseToks(t):null);
 const evalAt=(nd,x)=>{try{const r=rnum(cleanV(ev(nd,{x})));return isFinite(r)?r:NaN}catch(e){return NaN}};
 const g={};
 g.render=()=>{const nds=fns();let y='';const nd=nds[q.fn]||nds[0]||nds[1];if(nd)y=evalAt(nd,q.tr);
  return`<div class="gr"><canvas id="gcv"></canvas></div><div class="gst"><span>${nds[1]?(q.fn?'g':'f'):'f'}: x=${fmtNum(Number(q.tr.toPrecision(6)))}</span><span>y=${isNaN(y)?'—':fmtNum(Number(y.toPrecision(6)))}</span></div>`};
 g.after=()=>{const cv=document.getElementById('gcv');if(!cv)return;const r=cv.parentElement.getBoundingClientRect(),d=window.devicePixelRatio||1;
  cv.width=Math.max(10,Math.round(r.width*d));cv.height=Math.max(10,Math.round(r.height*d));cv.style.width=r.width+'px';cv.style.height=r.height+'px';
  const x=cv.getContext('2d'),W=cv.width,H=cv.height,ink=getComputedStyle(document.getElementById('scr')).color,nds=fns();
  const sx=v=>(v-GR.x0)/(GR.x1-GR.x0)*W,sy=v=>H-(v-GR.y0)/(GR.y1-GR.y0)*H;
  x.clearRect(0,0,W,H);x.lineWidth=d;x.strokeStyle=ink;
  const nice=s=>{const e=Math.pow(10,Math.floor(Math.log10(s))),m=s/e;return(m<1.5?1:m<3.5?2:m<7.5?5:10)*e};
  const gx=nice((GR.x1-GR.x0)/8),gy=nice((GR.y1-GR.y0)/6);x.globalAlpha=.22;x.beginPath();
  for(let v=Math.ceil(GR.x0/gx)*gx;v<=GR.x1;v+=gx){x.moveTo(sx(v),0);x.lineTo(sx(v),H)}for(let v=Math.ceil(GR.y0/gy)*gy;v<=GR.y1;v+=gy){x.moveTo(0,sy(v));x.lineTo(W,sy(v))}x.stroke();
  x.globalAlpha=.85;x.lineWidth=1.4*d;x.beginPath();if(GR.y0<=0&&GR.y1>=0){x.moveTo(0,sy(0));x.lineTo(W,sy(0))}if(GR.x0<=0&&GR.x1>=0){x.moveTo(sx(0),0);x.lineTo(sx(0),H)}x.stroke();
  x.globalAlpha=1;x.lineWidth=2*d;x.lineJoin='round';const span=GR.y1-GR.y0;
  nds.forEach((nd,k)=>{if(!nd)return;x.setLineDash(k?[6*d,4*d]:[]);x.beginPath();let pen=false,py=0;
   for(let i=0;i<=W;i++){const X=GR.x0+i/W*(GR.x1-GR.x0),Y=evalAt(nd,X);
    if(isNaN(Y)||Math.abs(Y-GR.y0)>span*50){pen=false;continue}
    const yy=sy(Y);if(pen&&Math.abs(yy-py)>H*1.5)pen=false;
    if(!pen){x.moveTo(i,yy);pen=true}else x.lineTo(i,yy);py=yy}
   x.stroke()});x.setLineDash([]);
  const nd=nds[q.fn]||nds[0]||nds[1];if(nd){const Y=evalAt(nd,q.tr);if(!isNaN(Y)){const px=sx(q.tr),py=sy(Y);x.fillStyle=ink;x.beginPath();x.arc(px,py,4.5*d,0,7);x.fill();x.strokeStyle=ink;x.lineWidth=d;x.beginPath();x.moveTo(px,0);x.lineTo(px,H);x.globalAlpha=.3;x.stroke()}}};
 const zoom=f=>{const cx=(GR.x0+GR.x1)/2,cy=(GR.y0+GR.y1)/2,hx=(GR.x1-GR.x0)/2*f,hy=(GR.y1-GR.y0)/2*f;GR.x0=cx-hx;GR.x1=cx+hx;GR.y0=cy-hy;GR.y1=cy+hy;q.tr=Math.min(Math.max(q.tr,GR.x0),GR.x1)};
 g.act=a=>{const st=(GR.x1-GR.x0)/60;
  if(a==='left'||a==='right'){q.tr+=(a==='left'?-1:1)*st;if(q.tr<GR.x0||q.tr>GR.x1){const s=(a==='left'?-1:1)*(GR.x1-GR.x0)*.25;GR.x0+=s;GR.x1+=s}}
  else if(a==='up')zoom(.7);else if(a==='down')zoom(1/.7);
